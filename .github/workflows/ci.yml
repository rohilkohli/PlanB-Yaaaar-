name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app + server)
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Plan-quality eval (offline, gated)
        run: npm run eval
      - name: Build
        run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end (390x844) + axe accessibility audits, light theme
        run: npx tsx e2e/run.ts
        env:
          # E2E runs zero-config so it never spends Google/LLM quota
          GOOGLE_PLACES_API_KEY: ""
          GEMINI_API_KEY: ""
      - name: End-to-end + axe accessibility audits, dark theme
        run: npx tsx e2e/run.ts
        env:
          COLOR_SCHEME: dark
          SHOT_DIR: e2e/screenshots/dark
          GOOGLE_PLACES_API_KEY: ""
          GEMINI_API_KEY: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
