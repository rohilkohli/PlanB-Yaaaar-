name: Deploy to Cloud Run
# Runs only for pushes to main. Authenticates with Workload Identity Federation (no stored secrets); the provider
# is restricted to this repo, the main branch and actor "rohilkohli" (see scripts/setup-github-deploy.sh).
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: planb-solo-90824
  REGION: asia-south1
  SERVICE: planb

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    if: github.actor == 'rohilkohli'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/326919665380/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: planb-deployer@planb-solo-90824.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      - name: Remember the live revision (for rollback)
        id: prev
        run: echo "rev=$(gcloud run services describe $SERVICE --region=$REGION --project=$PROJECT_ID --format='value(status.latestReadyRevisionName)')" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          gcloud run deploy $SERVICE --source . --project=$PROJECT_ID --region=$REGION -q \
            --allow-unauthenticated --max-instances=2 --memory=512Mi \
            --set-secrets=GOOGLE_PLACES_API_KEY=places-key:latest,GEMINI_API_KEY=gemini-key:latest,PLAN_SIGNING_KEY=plan-signing-key:latest,GOOGLE_MAPS_BROWSER_KEY=maps-key:latest \
            --set-env-vars=NODE_ENV=production,RATE_LIMIT_GENERATE_PER_DAY=10,PLACES_DAILY_REQUEST_CAP=700,GOOGLE_CLOUD_PROJECT=planb-solo-90824

      - name: Smoke test the new revision
        id: smoke
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --project=$PROJECT_ID --format='value(status.url)')
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true' && curl -fsS -o /dev/null "$URL/today"; then echo "healthy"; exit 0; fi
            sleep 10
          done
          echo "smoke test failed"; exit 1

      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.rev != ''
        run: gcloud run services update-traffic $SERVICE --region=$REGION --project=$PROJECT_ID --to-revisions=${{ steps.prev.outputs.rev }}=100
